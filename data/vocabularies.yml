# Controlled vocabularies for the registry.
#
# Each list gives the allowed values for one field. Where a value matches an
# EOSC Service Profile v5.0 vocabulary term, its EOSC ID is given so the build
# can produce an EOSC-compatible export.
#
# If you change this file, run `python scripts/generate.py` to update
# schema/*.schema.json and .pages.yml (the GitHub Action checks they match).

