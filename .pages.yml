# Pages CMS configuration for the A&H DRI registry.
# GENERATED by scripts/generate.py from schema/fields.yml and
# data/vocabularies.yml. Do not edit by hand: change those files and
# run `python scripts/generate.py`.
settings:
  commit:
    identity: user
content:
- name: resources
  label: Resources
  description: Compute services researchers can use (whose hardware runs the work).
  type: collection
  path: data/resources
  format: yaml
  filename: '{fields.id}.yml'
  fields:
  - name: id
    label: ID
    description: 'Short, permanent identifier used in file names and API URLs: lowercase letters, numbers and hyphens, e.g. isambard-ai. Do not change it once published.'
    type: string
    required: true
  - name: name
    label: Resource name
    description: Full name of the service
    type: string
    required: true
  - name: provider
    label: Provider organisation
    description: Organisation that runs it
    type: string
    required: true
  - name: provider_level
    label: Provider level
    description: Who offers it
    type: select
    options:
      values:
      - Institutional
      - Regional
      - National
      - Commercial
      - International
    required: true
  - name: national_programme
    label: National programme
    description: Which UK national programme the service belongs to, which decides the access route. NCRs replace the old Tier-2 services
    type: select
    options:
      values:
      - AIRR
      - NCR
      - AIRR + NCR
      - Tier-1
      - Tier-2 (legacy)
      - Other national service
      - Not applicable
  - name: webpage
    label: Webpage
    description: Main URL
    type: string
  - name: description
    label: Description
    description: Two or three sentences in plain language
    type: text
  - name: good_for
    label: Good for
    description: Typical arts and humanities tasks it suits, e.g. transcribing audio, handwriting recognition, image classification
    type: text
  - name: eosc_subcategory
    label: EOSC subcategory
    description: Type of compute service. The EOSC category is always Compute for this collection
    type: select
    options:
      values:
      - Virtual Machine Management
      - Container Management
      - Job Execution
      - Workload Management
      - Orchestration
      - Serverless Applications Repository
      - Other
  - name: architecture
    label: Architecture
    description: Type of computing
    type: select
    options:
      values:
      - CPU only
      - CPU + GPU
      - Other accelerator
      - Unknown
  - name: interface
    label: Interface
    description: How researchers use it
    type: select
    options:
      values:
      - Web interface
      - Notebook
      - Command line
      - Command line + web portal
  - name: eligibility
    label: Eligibility
    description: Who can use it, e.g. staff at member institutions, any UK researcher, early career, unaffiliated
    type: text
  - name: how_to_apply
    label: How to apply
    description: Steps in one line, plus URL
    type: text
  - name: time_to_access
    label: Time to access
    description: How long until you can use it, e.g. same day, 2 weeks, next allocation round
    type: string
  - name: access_mode
    label: Access mode
    description: Basis on which access is granted
    type: select
    options:
      values:
      - Free
      - Free Conditionally
      - Peer Reviewed
      - Paid
      - Other
  - name: cost_band
    label: Cost band
    description: How it is paid for
    type: select
    options:
      values:
      - Free at point of use
      - Allocation-based
      - Internal recharge
      - Commercial
      - Mixed
      - Unknown
  - name: contact
    label: Contact for researchers
    description: Team name and email that researchers should contact for help or access. Use team addresses, not named individuals
    type: string
  - name: last_checked
    label: Last checked
    description: Date the entry was verified
    type: date
    required: true
  - name: short_name
    label: Short name
    description: Abbreviation
    type: string
  - name: tagline
    label: One-line summary
    description: Tagline
    type: string
  - name: logo_url
    label: Logo URL
    description: Link to the provider's logo (do not copy logos into this repository)
    type: string
  - name: scientific_domain
    label: Scientific domain
    description: Main domain served; list others in Notes
    type: select
    options:
      values:
      - Humanities
      - Social Sciences
      - Generic
      - Natural Sciences
      - Engineering & Technology
      - Medical & Health Sciences
      - Agricultural Sciences
      - Other
  - name: target_users
    label: Target users
    description: Main user group; list others in Notes
    type: select
    options:
      values:
      - Researchers
      - Research Groups
      - Research Projects
      - Research Communities
      - Research Networks
      - Research Organisations
      - Students
      - Research Managers
      - Research Infrastructure Managers
      - Resource Managers
      - Provider Managers
      - Providers
      - Businesses
      - Innovators
      - Funders
      - Policy Makers
      - Publishers
      - Other
  - name: geographical_availability
    label: Geographical availability
    description: Where users must be based
    type: string
  - name: language_availability
    label: Language availability
    description: Languages the service is offered in
    type: string
  - name: public_contact_email
    label: Public contact email
    description: Public contact for the service (EOSC admin field)
    type: string
  - name: helpdesk_email
    label: Helpdesk email
    description: Support address (EOSC admin field)
    type: string
  - name: security_contact_email
    label: Security contact email
    description: EOSC admin field
    type: string
  - name: trl
    label: Technology readiness level
    description: EOSC admin field
    type: select
    options:
      values:
      - 1 - basic principles observed
      - 2 - technology concept formulated
      - 3 - experimental proof of concept
      - 4 - technology validated in lab
      - 5 - technology validated in relevant environment
      - 6 - technology demonstrated in relevant environment
      - 7 - system prototype demonstration in operational environment
      - 8 - system complete and qualified
      - 9 - actual system proven in operational environment
  - name: order_type
    label: Order type
    description: How access is ordered
    type: select
    options:
      values:
      - Fully Open Access
      - Open Access
      - Order Required
      - Other
  - name: system_type
    label: System type
    description: Kind of service
    type: select
    options:
      values:
      - HPC cluster
      - Cloud virtual machines
      - Containers
      - Notebook service
      - Dedicated AI system
      - Other
  - name: ai_models_available
    label: AI models available
    description: Whether the service offers ready-to-use AI models, or you bring and run your own
    type: select
    options:
      values:
      - Run your own models (open-weight or self-trained)
      - Run your own + hosted models (paid)
      - Run your own + hosted models (included)
      - Hosted models only
      - None
      - Unknown
  - name: application_window
    label: Application window
    description: Can a researcher apply now? Steps and timing details go in How to apply
    type: select
    options:
      values:
      - Open all year
      - Periodic calls
      - Not yet published
      - Closed
      - Not applicable (sign up any time)
  - name: login_method
    label: Login method
    description: How users sign in
    type: select
    options:
      values:
      - Institutional login
      - eduGAIN
      - Own account
      - Other
  - name: access_type
    label: Access type
    description: How users reach it
    type: select
    options:
      values:
      - Remote
      - Virtual
      - Physical
      - Mail-In
      - Other
  - name: indicative_cost
    label: Indicative cost
    description: Rough price, e.g. £ per GPU-hour or core-hour
    type: text
  - name: costable_in_grants
    label: Can be costed into grants
    description: Whether funders accept it as a project cost. Rules vary by funder and scheme, so confirm with your research office
    type: select
    options:
      values:
      - Usually, check funder rules
      - 'No'
      - Unsure
  - name: pricing_url
    label: Pricing URL
    description: Link to the current price list. Only for services that charge
    type: string
  - name: server_location
    label: Server location
    description: Country where data is processed
    type: string
  - name: sensitive_data
    label: Suitable for sensitive data
    description: Personal or restricted material. Only what the service itself states counts
    type: select
    options:
      values:
      - 'Yes'
      - 'No'
      - With conditions
      - Unknown
  - name: certifications
    label: Certifications
    description: e.g. ISO 27001
    type: string
  - name: terms_of_use_url
    label: Terms of use URL
    description: Link to terms of use
    type: string
  - name: privacy_policy_url
    label: Privacy policy
    description: Link to privacy policy (a short note may accompany the link)
    type: string
  - name: energy_carbon_info
    label: Energy or carbon information
    description: Published environmental information, or Not published
    type: text
  - name: user_manual_url
    label: User manual URL
    description: Link to user documentation
    type: string
  - name: training_url
    label: Training URL
    description: Link to training material
    type: string
  - name: life_cycle_status
    label: Life cycle status
    description: Phase of the service
    type: select
    options:
      values:
      - Production
      - Operation
      - Beta
      - Alpha
      - Implementation
      - Planned
      - Preparation
      - Design
      - Discovery
      - Concept
      - In containment
      - Retirement
      - Termination
      - Other
  - name: collected_by
    label: Collected by
    description: Who filled in or last updated the entry, e.g. 'Your Name' or 'Your Name, AI-assisted (tool)'
    type: string
  - name: notes
    label: Notes
    description: Anything unclear or missing; extra target users or domains. Mark unverified facts with [to be confirmed]
    type: text
- name: tools
  label: Tools and models
  description: Software and model libraries researchers run themselves.
  type: collection
  path: data/tools
  format: yaml
  filename: '{fields.id}.yml'
  fields:
  - name: id
    label: ID
    description: 'Short, permanent identifier: lowercase letters, numbers and hyphens, e.g. llama-cpp'
    type: string
    required: true
  - name: name
    label: Name
    type: string
    required: true
  - name: type
    label: Type
    type: select
    options:
      values:
      - Model runner
      - Model library
      - Model runner + library
      - User interface
      - Other
    required: true
  - name: organisation
    label: Organisation
    type: string
  - name: webpage
    label: Webpage
    type: string
  - name: runs_on
    label: Runs on
    type: select
    options:
      values:
      - Own computer
      - Own computer or HPC
      - HPC or cloud
      - Cloud only
      - Any
  - name: licence
    label: Licence
    type: string
  - name: cost
    label: Cost
    type: select
    options:
      values:
      - Free
      - Free + paid tiers
      - Paid
      - Unknown
  - name: data_stays_local
    label: Data stays local
    type: select
    options:
      values:
      - 'Yes'
      - 'No'
      - Optional
      - Unknown
  - name: ease_of_use
    label: Ease of use
    type: select
    options:
      values:
      - Desktop app
      - Web interface
      - Command line
      - Mixed
  - name: works_on
    label: Works on (resources)
    description: Resources whose own documentation supports or documents this tool. Leave empty if it would only 'probably' work
    type: reference
    options:
      collection: resources
      search: name,short_name
      value: '{id}'
      label: '{name}'
      multiple: true
  - name: notes
    label: Notes
    type: text
- name: ai_services
  label: AI services
  description: Products whose main purpose is chatting with or calling an AI model, one entry per version (free, institutional, API), because data terms differ by version.
  type: collection
  path: data/ai-services
  format: yaml
  filename: '{fields.id}.yml'
  fields:
  - name: id
    label: ID
    description: 'Short, permanent identifier: lowercase letters, numbers and hyphens, e.g. chatgpt-edu'
    type: string
    required: true
  - name: name
    label: Name
    type: string
    required: true
  - name: provider
    label: Provider
    type: string
    required: true
  - name: version
    label: Version described
    description: Data terms differ by version
    type: select
    options:
      values:
      - Free consumer
      - Paid individual
      - Institutional / education
      - API
    required: true
  - name: access
    label: Access
    type: select
    options:
      values:
      - App
      - API
      - App and API
  - name: institutional_licence
    label: Institutional licence
    type: select
    options:
      values:
      - 'Yes'
      - 'No'
      - Check locally
  - name: trains_on_inputs
    label: Trains on inputs by default
    type: select
    options:
      values:
      - 'Yes'
      - 'No'
      - Opt-out available
      - Unknown
  - name: data_location
    label: Data location
    type: text
  - name: sensitive_data
    label: Suitable for sensitive data
    type: select
    options:
      values:
      - 'Yes'
      - 'No'
      - With conditions
      - Unknown
  - name: cost
    label: Cost
    type: select
    options:
      values:
      - Free
      - Free + paid tiers
      - Paid
      - Pay per use
  - name: model_openness
    label: Model openness
    type: select
    options:
      values:
      - Proprietary
      - Open-weight
      - Mixed
  - name: webpage
    label: Webpage
    type: string
  - name: last_checked
    label: Last checked
    type: date
    required: true
  - name: notes
    label: Notes
    type: text
